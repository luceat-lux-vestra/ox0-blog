<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Allocator speed improvement versus peak RSS increase</title>
  <desc id="desc">System and snmalloc form the practical trade-off frontier. The plotted coordinates are simple averages of the cursor and paging relative medians, used only as a visual summary.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="70" y="62" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#111827">No allocator won both speed and memory</text>
  <text x="70" y="96" font-family="system-ui,sans-serif" font-size="17" fill="#4b5563">Average of cursor/paging relative medians · visual summary only</text>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="130" y1="575" x2="1110" y2="575"/>
    <line x1="130" y1="450" x2="1110" y2="450"/>
    <line x1="130" y1="325" x2="1110" y2="325"/>
    <line x1="130" y1="200" x2="1110" y2="200"/>
    <line x1="130" y1="130" x2="130" y2="575"/>
    <line x1="431" y1="130" x2="431" y2="575"/>
    <line x1="733" y1="130" x2="733" y2="575"/>
    <line x1="1034" y1="130" x2="1034" y2="575"/>
  </g>

  <line x1="130" y1="408" x2="1110" y2="408" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="130" y1="130" x2="130" y2="575" stroke="#374151" stroke-width="2"/>
  <line x1="130" y1="575" x2="1110" y2="575" stroke="#374151" stroke-width="2"/>

  <g font-family="system-ui,sans-serif" font-size="15" fill="#6b7280">
    <text x="130" y="607" text-anchor="middle">0%</text>
    <text x="431" y="607" text-anchor="middle">20%</text>
    <text x="733" y="607" text-anchor="middle">40%</text>
    <text x="1034" y="607" text-anchor="middle">60%</text>
    <text x="112" y="580" text-anchor="end">−1%</text>
    <text x="112" y="413" text-anchor="end">0%</text>
    <text x="112" y="246" text-anchor="end">+1%</text>
    <text x="112" y="158" text-anchor="end">+2%</text>
  </g>

  <text x="620" y="655" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#374151">Peak RSS increase vs system →</text>
  <text x="32" y="350" transform="rotate(-90 32 350)" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#374151">Elapsed-time improvement →</text>

  <polyline points="130,408 299,148" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="205" y="245" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#059669">practical frontier</text>

  <g font-family="system-ui,sans-serif">
    <circle cx="130" cy="408" r="15" fill="#2563eb"/>
    <text x="155" y="400" font-size="20" font-weight="700" fill="#111827">system</text>
    <text x="155" y="424" font-size="15" fill="#6b7280">0% speed · 0% RSS</text>

    <circle cx="299" cy="148" r="17" fill="#059669"/>
    <text x="325" y="140" font-size="20" font-weight="700" fill="#111827">snmalloc</text>
    <text x="325" y="164" font-size="15" fill="#6b7280">+2.32% speed · +11.2% RSS</text>

    <circle cx="240" cy="471" r="14" fill="#7c3aed"/>
    <text x="264" y="464" font-size="19" font-weight="700" fill="#111827">jemalloc</text>
    <text x="264" y="488" font-size="15" fill="#6b7280">−0.38% speed · +7.3% RSS</text>

    <circle cx="1040" cy="214" r="16" fill="#d97706"/>
    <text x="1016" y="190" text-anchor="end" font-size="19" font-weight="700" fill="#111827">mimalloc</text>
    <text x="1016" y="214" text-anchor="end" font-size="15" fill="#6b7280">+1.74% speed · +60.4% RSS</text>

    <circle cx="784" cy="498" r="16" fill="#dc2626"/>
    <text x="760" y="524" text-anchor="end" font-size="19" font-weight="700" fill="#111827">tcmalloc</text>
    <text x="760" y="548" text-anchor="end" font-size="15" fill="#6b7280">−0.54% speed · +43.4% RSS</text>
  </g>

  <text x="1110" y="682" text-anchor="end" font-family="system-ui,sans-serif" font-size="13" fill="#9ca3af">OxideBatch 0.7.0 · OCI ARM64 · postgres-postgres</text>
</svg>
