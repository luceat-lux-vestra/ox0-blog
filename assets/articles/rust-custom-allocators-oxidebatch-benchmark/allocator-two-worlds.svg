<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Two meanings of custom allocator</title>
  <desc id="desc">The left side shows general-purpose malloc replacements such as jemalloc and snmalloc. The right side shows game-style workload-specialized allocators such as frame, pool, stack, linear, and arena allocators.</desc>
  <rect width="1200" height="650" fill="#ffffff"/>
  <text x="70" y="64" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#111827">“Custom allocator” can mean two different engineering choices</text>
  <text x="70" y="100" font-family="system-ui,sans-serif" font-size="17" fill="#4b5563">Global malloc replacement ≠ workload-specialized memory system</text>

  <rect x="70" y="145" width="500" height="405" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="105" y="190" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#2563eb">GENERAL-PURPOSE REPLACEMENT</text>
  <text x="105" y="228" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#111827">Replace malloc/free globally</text>
  <text x="105" y="270" font-family="system-ui,sans-serif" font-size="18" fill="#374151">jemalloc · mimalloc · snmalloc · tcmalloc</text>
  <text x="105" y="318" font-family="system-ui,sans-serif" font-size="17" fill="#374151">Must handle arbitrary:</text>
  <text x="125" y="352" font-family="system-ui,sans-serif" font-size="17" fill="#374151">• sizes and lifetimes</text>
  <text x="125" y="384" font-family="system-ui,sans-serif" font-size="17" fill="#374151">• allocation/free order</text>
  <text x="125" y="416" font-family="system-ui,sans-serif" font-size="17" fill="#374151">• thread ownership patterns</text>
  <text x="105" y="472" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">Typical goals</text>
  <text x="105" y="503" font-family="system-ui,sans-serif" font-size="16" fill="#374151">scalability · fragmentation · throughput · profiling</text>

  <rect x="630" y="145" width="500" height="405" rx="22" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="665" y="190" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#059669">WORKLOAD-SPECIALIZED</text>
  <text x="665" y="228" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#111827">Exploit domain knowledge</text>
  <text x="665" y="270" font-family="system-ui,sans-serif" font-size="18" fill="#374151">frame · pool · linear · stack · arena · bucket</text>
  <text x="665" y="318" font-family="system-ui,sans-serif" font-size="17" fill="#374151">Can assume:</text>
  <text x="685" y="352" font-family="system-ui,sans-serif" font-size="17" fill="#374151">• known lifetime / bulk reset</text>
  <text x="685" y="384" font-family="system-ui,sans-serif" font-size="17" fill="#374151">• fixed or narrow size classes</text>
  <text x="685" y="416" font-family="system-ui,sans-serif" font-size="17" fill="#374151">• subsystem / frame ownership</text>
  <text x="665" y="472" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#047857">Typical goals</text>
  <text x="665" y="503" font-family="system-ui,sans-serif" font-size="16" fill="#374151">predictability · no fragmentation · budgets · O(1) reset</text>

  <path d="M570 345 H630" stroke="#9ca3af" stroke-width="3"/>
  <text x="600" y="326" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#6b7280">different</text>
  <text x="600" y="365" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#6b7280">question</text>

  <text x="600" y="610" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#111827">Game-engine success with the right-hand side does not imply a universal left-hand-side winner.</text>
</svg>
