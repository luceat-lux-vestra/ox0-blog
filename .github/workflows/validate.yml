name: Validate blog source

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test
        run: npm test
      - name: Validate Article sources
        run: npm run validate
  preview:
    name: PR Article Preview
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.validate.result == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Initialize preview paths
        run: |
          echo "PREVIEW_FILE=$RUNNER_TEMP/article-preview.html" >> "$GITHUB_ENV"
          echo "MANIFEST_LIST=$RUNNER_TEMP/article-preview-manifests.txt" >> "$GITHUB_ENV"

      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.EXPECTED_SHA }}

      - name: Verify exact checkout and base
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$BASE_SHA^{commit}"

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Select affected Articles
        id: discover
        run: |
          set -eu
          changed="$RUNNER_TEMP/article-preview-changed.txt"
          merge_base="$(git merge-base "$BASE_SHA" "$EXPECTED_SHA")"
          git diff --name-only --find-renames "$merge_base" "$EXPECTED_SHA" > "$changed"

          if grep -Eq '^(assets/|src/|scripts/build-article-preview[.]mjs$|package(-lock)?[.]json$|[.]github/workflows/validate[.]yml$)' "$changed"; then
            find posts -mindepth 2 -maxdepth 2 -type f -name article.json -print | sort -u > "$MANIFEST_LIST"
          else
            awk -F/ '$1 == "posts" && NF >= 3 { print $1 "/" $2 "/article.json" }' "$changed" \
              | sort -u \
              | while IFS= read -r manifest; do
                  [ -f "$manifest" ] && printf '%s\n' "$manifest"
                done > "$MANIFEST_LIST"
          fi

          if [ -s "$MANIFEST_LIST" ]; then
            echo 'has_articles=true' >> "$GITHUB_OUTPUT"
            echo 'Selected Article manifests:'
            cat "$MANIFEST_LIST"
          else
            echo 'has_articles=false' >> "$GITHUB_OUTPUT"
            echo 'No current Article manifests require preview.'
          fi

      - name: Build exact-HEAD HTML preview
        if: steps.discover.outputs.has_articles == 'true'
        env:
          RESOURCE_BASE_URL: https://raw.githubusercontent.com/${{ env.HEAD_REPOSITORY }}/${{ env.EXPECTED_SHA }}/
        run: |
          set -eu
          npm run preview:articles -- \
            --output "$PREVIEW_FILE" \
            --resource-base-url "$RESOURCE_BASE_URL" \
            --source-revision "$EXPECTED_SHA" \
            --manifest-list "$MANIFEST_LIST"

      - name: Upload browser-review HTML
        if: steps.discover.outputs.has_articles == 'true'
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.PREVIEW_FILE }}
          archive: false
          retention-days: 7
          if-no-files-found: error

      - name: Publish preview summary
        if: always()
        env:
          HAS_ARTICLES: ${{ steps.discover.outputs.has_articles }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo '## PR Article Preview'
            echo
            echo "Exact HEAD: $EXPECTED_SHA"
            echo
            if [ "$HAS_ARTICLES" = 'true' ]; then
              echo "[Open Article preview artifact]($ARTIFACT_URL)"
              echo
              echo 'Open article-preview.html from the artifact view to review the complete rendered candidate.'
              echo
              echo '### Included manifests'
              while IFS= read -r manifest; do
                [ -n "$manifest" ] && echo "- $manifest"
              done < "$MANIFEST_LIST"
            else
              echo 'No current Article manifest required preview for this pull request.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Workflow Security
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install checksum-pinned actionlint
        run: |
          set -eu
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error             "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_arm64.tar.gz"             --output "$archive"
          echo "${ACTIONLINT_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

      - name: Lint every active workflow
        run: '"$RUNNER_TEMP/actionlint" .github/workflows/*.yml'

      - name: Prove malformed workflow fixture is rejected
        run: |
          set -eu
          if "$RUNNER_TEMP/actionlint" .github/fixtures/actionlint-invalid.yml >"$RUNNER_TEMP/invalid.out" 2>&1; then
            echo "negative fixture unexpectedly passed actionlint" >&2
            cat "$RUNNER_TEMP/invalid.out" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/invalid.out"

      - name: Check repository-owned hardening invariants
        run: |
          node scripts/check-repository-hardening.mjs --self-test
          node scripts/check-repository-hardening.mjs

      - name: Audit GitHub Actions trust boundaries with zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: "1.29.0"
          inputs: ".github/workflows/"
          online-audits: false
          advanced-security: false
          min-severity: medium
          min-confidence: medium

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  merge-gate:
    name: Merge Gate
    if: always()
    needs: [validate, security, dependency-review, preview]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Verify direct PR DAG
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const required = ['validate', 'security', 'dependency-review'];
          const expected = [...required, 'preview'].sort();
          const actual = Object.keys(needs).sort();
          const failures = [];
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            failures.push(`unexpected DAG members: ${JSON.stringify(actual)}`);
          }
          for (const job of required) {
            if (needs[job]?.result !== 'success') {
              failures.push(`${job}: ${needs[job]?.result ?? 'missing'}`);
            }
          }
          const wantedPreview = process.env.IS_DRAFT === 'true' ? 'skipped' : 'success';
          if (needs.preview?.result !== wantedPreview) {
            failures.push(`preview: ${needs.preview?.result ?? 'missing'} (expected ${wantedPreview})`);
          }
          if (failures.length) {
            for (const failure of failures) console.error(`::error::${failure}`);
            process.exit(1);
          }
          console.log('Merge Gate: direct PR checks verified');
          NODE
