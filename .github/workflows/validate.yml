name: Validate blog source

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test
        run: npm test
      - name: Validate Article sources
        run: npm run validate

  live-draft-verify-once:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 2 && github.event.pull_request.head.ref == 'feat/authoring-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ox0-blog
    env:
      OX0_ARTICLE_DRAFT_VERIFY: '1'
      OX0_ARTICLE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      OX0_ARTICLE_EXPECTED_URL: https://blog.ox0.uk
      GHOST_ADMIN_URL: ${{ vars.GHOST_ADMIN_URL || secrets.GHOST_ADMIN_URL }}
      GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact checkout and required Ghost bindings
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$OX0_ARTICLE_SOURCE_SHA"
          test -n "$GHOST_ADMIN_URL" || { echo 'GHOST_ADMIN_URL is not configured' >&2; exit 1; }
          test -n "$GHOST_ADMIN_API_KEY" || { echo 'GHOST_ADMIN_API_KEY is not configured' >&2; exit 1; }

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run one-shot live draft verifier
        run: npm run verify:article-live-draft

