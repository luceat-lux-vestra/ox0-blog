name: Repository Drift

on:
  # Run after a merge only when repository policy or its audit implementation changes.
  # Scheduled and manual audits independently detect live settings drift.
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'scripts/check-repository-hardening.mjs'
      - 'SECURITY.md'
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-drift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Repository Drift
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Audit checked-in and readable live controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-repository-hardening.mjs --self-test
          node scripts/check-repository-hardening.mjs --live
