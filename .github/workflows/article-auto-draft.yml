name: Auto Draft New Articles

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'

permissions:
  contents: read

concurrency:
  group: ox0-blog-ghost-control
  cancel-in-progress: false

jobs:
  article-drafts:
    name: Synchronize newly merged Articles as Ghost drafts
    if: github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ox0-blog
    env:
      BEFORE_SHA: ${{ github.event.before }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out exact merged main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify exact push source
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$BEFORE_SHA" "$SOURCE_SHA"

      - name: Discover newly added Article manifests
        id: discover
        run: |
          set -eu
          output="$RUNNER_TEMP/new-article-manifests.txt"
          git diff --name-status --find-renames "$BEFORE_SHA" "$SOURCE_SHA" -- posts/             | awk -F '\t' '$1 == "A" && $2 ~ /^posts\/[^/]+\/article[.]json$/ { print $2 }'             | sort -u > "$output"

          if [ -s "$output" ]; then
            echo 'has_articles=true' >> "$GITHUB_OUTPUT"
            echo 'New Article manifests:'
            cat "$output"
          else
            echo 'has_articles=false' >> "$GITHUB_OUTPUT"
            echo 'No newly added Article manifests; nothing to project.'
          fi

      - name: Set up Node.js 24
        if: steps.discover.outputs.has_articles == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        if: steps.discover.outputs.has_articles == 'true'
        run: npm ci --ignore-scripts

      - name: Test
        if: steps.discover.outputs.has_articles == 'true'
        run: npm test

      - name: Validate repository source
        if: steps.discover.outputs.has_articles == 'true'
        run: npm run validate

      - name: Synchronize READY/SYNCED Articles as drafts
        if: steps.discover.outputs.has_articles == 'true'
        env:
          GHOST_ADMIN_URL: ${{ vars.GHOST_ADMIN_URL || secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          OX0_HOST_RUNTIME_MODULE: ${{ vars.OX0_HOST_RUNTIME_MODULE }}
        run: |
          set -eu
          while IFS= read -r manifest; do
            [ -n "$manifest" ] || continue
            npm run validate:articles -- --ready "$manifest"
            npm run sync:article -- "$manifest" draft
          done < "$RUNNER_TEMP/new-article-manifests.txt"
