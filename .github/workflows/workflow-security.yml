name: Workflow Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Workflow Security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install checksum-pinned actionlint
        run: |
          set -eu
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error             "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"             --output "$archive"
          echo "${ACTIONLINT_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

      - name: Lint every active workflow
        run: '"$RUNNER_TEMP/actionlint" .github/workflows/*.yml'

      - name: Prove malformed workflow fixture is rejected
        run: |
          set -eu
          if "$RUNNER_TEMP/actionlint" .github/fixtures/actionlint-invalid.yml >"$RUNNER_TEMP/invalid.out" 2>&1; then
            echo "negative fixture unexpectedly passed actionlint" >&2
            cat "$RUNNER_TEMP/invalid.out" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/invalid.out"

      - name: Check repository-owned hardening invariants
        run: node scripts/check-repository-hardening.mjs

      - name: Audit GitHub Actions trust boundaries with zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: "1.29.0"
          inputs: ".github/workflows/"
          online-audits: false
          advanced-security: false
          min-severity: medium
          min-confidence: medium
