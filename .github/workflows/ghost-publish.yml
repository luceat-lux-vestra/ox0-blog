name: Legacy Publish to Ghost (compatibility)

on:
  workflow_dispatch:
    inputs:
      post_path:
        description: Legacy repository-relative one-file Markdown source under posts/
        required: true
        type: string
      action:
        description: Legacy compatibility preview/draft/publish action
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - draft
          - publish

permissions:
  contents: read

concurrency:
  group: ox0-blog-ghost-control
  cancel-in-progress: false

jobs:
  publish:
    name: Legacy one-file Ghost compatibility path
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ox0-blog
    env:
      OX0_LEGACY_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Verify legacy dispatch source is still current main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          CURRENT_MAIN_SHA="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["object"]["sha"])'
          )"
          test "$CURRENT_MAIN_SHA" = "$OX0_LEGACY_SOURCE_SHA" || {
            echo 'legacy dispatch source is no longer current main; dispatch a fresh operation' >&2
            exit 1
          }

      - name: Check out exact dispatch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$OX0_LEGACY_SOURCE_SHA"

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Test publisher
        run: npm test

      - name: Validate migration repository and selected legacy post
        env:
          POST_PATH: ${{ inputs.post_path }}
        run: |
          set -eu
          npm run validate
          node scripts/validate-post.mjs "$POST_PATH"

      - name: Reverify current main immediately before Ghost operation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          CURRENT_MAIN_SHA="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["object"]["sha"])'
          )"
          test "$CURRENT_MAIN_SHA" = "$OX0_LEGACY_SOURCE_SHA" || {
            echo 'main advanced during legacy workflow; refusing stale Ghost operation' >&2
            exit 1
          }

      - name: Preview legacy Ghost changes
        if: inputs.action == 'dry-run'
        env:
          GHOST_ADMIN_URL: ${{ vars.GHOST_ADMIN_URL || secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          POST_PATH: ${{ inputs.post_path }}
        run: node scripts/plan-post.mjs "$POST_PATH"

      - name: Synchronize legacy post
        if: inputs.action != 'dry-run'
        env:
          GHOST_ADMIN_URL: ${{ vars.GHOST_ADMIN_URL || secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          POST_PATH: ${{ inputs.post_path }}
          PUBLISH_ACTION: ${{ inputs.action }}
        run: node scripts/publish-post.mjs "$POST_PATH" "$PUBLISH_ACTION"
