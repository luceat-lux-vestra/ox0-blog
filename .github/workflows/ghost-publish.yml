name: Publish to Ghost

on:
  workflow_dispatch:
    inputs:
      post_path:
        description: Repository-relative Markdown file under posts/
        required: true
        type: string
      action:
        description: Preview, synchronize as draft, or explicitly publish
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - draft
          - publish

permissions:
  contents: read

concurrency:
  group: ghost-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ox0-blog
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test publisher
        run: npm test
      - name: Validate repository and selected post
        env:
          POST_PATH: ${{ inputs.post_path }}
        run: node scripts/validate-post.mjs "$POST_PATH"
      - name: Preview Ghost changes
        if: inputs.action == 'dry-run'
        env:
          GHOST_ADMIN_URL: ${{ vars.GHOST_ADMIN_URL || secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          POST_PATH: ${{ inputs.post_path }}
        run: node scripts/plan-post.mjs "$POST_PATH"
      - name: Synchronize post
        if: inputs.action != 'dry-run'
        env:
          GHOST_ADMIN_URL: ${{ vars.GHOST_ADMIN_URL || secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          POST_PATH: ${{ inputs.post_path }}
          PUBLISH_ACTION: ${{ inputs.action }}
        run: node scripts/publish-post.mjs "$POST_PATH" "$PUBLISH_ACTION"
