name: Article Ghost Control Surface

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Repository-relative Article manifest under posts/.../article.json
        required: true
        type: string
      source_sha:
        description: Exact lowercase 40-hex SHA of current main to operate on
        required: true
        type: string
      operation:
        description: Read-only plan, managed draft synchronization, or production publish
        required: true
        default: plan-draft
        type: choice
        options:
          - plan-draft
          - draft
          - plan-publish
          - publish
      publish_confirmation:
        description: 'For publish only: publish:<manifest_path>@<source_sha>; leave empty otherwise'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ox0-blog-ghost-control
  cancel-in-progress: false

jobs:
  article:
    name: Guarded Article Ghost operation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ox0-blog
    env:
      MANIFEST_PATH: ${{ inputs.manifest_path }}
      OX0_ARTICLE_SOURCE_SHA: ${{ inputs.source_sha }}
      OX0_ARTICLE_OPERATION: ${{ inputs.operation }}
      OX0_ARTICLE_PUBLISH_CONFIRMATION: ${{ inputs.publish_confirmation }}
    steps:
      - name: Verify dispatch source binding before checkout
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -eu
          case "$DISPATCH_SHA" in
            *[!0-9a-f]*|'') echo 'source_sha must be lowercase hexadecimal' >&2; exit 1 ;;
          esac
          test "${#DISPATCH_SHA}" -eq 40 || { echo 'source_sha must be exactly 40 hex characters' >&2; exit 1; }
          test "$EVENT_REF" = 'refs/heads/main' || { echo 'Article Ghost workflow may run only from main' >&2; exit 1; }
          test "$DISPATCH_SHA" = "$EVENT_SHA" || { echo 'source_sha must equal the exact workflow_dispatch main SHA' >&2; exit 1; }

      - name: Verify dispatch source is still current main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          CURRENT_MAIN_SHA="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["object"]["sha"])'
          )"
          test "$CURRENT_MAIN_SHA" = "$OX0_ARTICLE_SOURCE_SHA" || {
            echo 'source_sha is no longer current main; dispatch a fresh operation' >&2
            exit 1
          }

      - name: Check out exact authorized source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$OX0_ARTICLE_SOURCE_SHA"

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Validate repository and selected Article
        run: |
          set -eu
          npm run validate
          if [ "$OX0_ARTICLE_OPERATION" = 'plan-publish' ] || [ "$OX0_ARTICLE_OPERATION" = 'publish' ]; then
            npm run validate:articles -- --ready "$MANIFEST_PATH"
          else
            npm run validate:articles -- "$MANIFEST_PATH"
          fi

      - name: Reverify current main immediately before operation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          CURRENT_MAIN_SHA="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["object"]["sha"])'
          )"
          test "$CURRENT_MAIN_SHA" = "$OX0_ARTICLE_SOURCE_SHA" || {
            echo 'main advanced during workflow; refusing stale Article operation' >&2
            exit 1
          }

      - name: Execute guarded Article operation
        env:
          GHOST_ADMIN_URL: ${{ vars.GHOST_ADMIN_URL || secrets.GHOST_ADMIN_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          OX0_HOST_RUNTIME_MODULE: ${{ vars.OX0_HOST_RUNTIME_MODULE }}
        run: node scripts/workflow-dispatch-article.mjs "$MANIFEST_PATH"

      - name: Trigger profile Publications refresh
        if: inputs.operation == 'publish'
        env:
          PROFILE_REPO_DISPATCH_TOKEN: ${{ secrets.PROFILE_REPO_DISPATCH_TOKEN }}
        run: |
          set -eu
          if [ -z "$PROFILE_REPO_DISPATCH_TOKEN" ]; then
            echo '::warning::PROFILE_REPO_DISPATCH_TOKEN is not configured; profile schedule remains the fallback.'
            exit 0
          fi
          payload="$(
            python3 -c 'import json, os; print(json.dumps({"event_type":"blog-publication","client_payload":{"source_sha":os.environ["OX0_ARTICLE_SOURCE_SHA"],"manifests":[os.environ["MANIFEST_PATH"]],"trigger":"manual-publish"}}))'
          )"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $PROFILE_REPO_DISPATCH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/luceat-lux-vestra/luceat-lux-vestra/dispatches"
