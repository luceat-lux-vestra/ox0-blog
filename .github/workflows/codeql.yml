name: CodeQL

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact current protected main SHA"
        required: true
        type: string
  schedule:
    - cron: "17 3 * * 3"

permissions: {}

concurrency:
  group: codeql-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
    steps:
      - name: Verify current main and exact scan identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [ "$GITHUB_REF" = "refs/heads/main" ] || exit 1
          [ "$GITHUB_SHA" = "$EXPECTED_SHA" ] || exit 1
          remote_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [ "$remote_main" = "$EXPECTED_SHA" ] || exit 1

      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
